    <script>
      (function () {
        if (typeof window === 'undefined') return;

        // 1. Intercept Vite HMR WebSocket to eliminate 'WebSocket closed without opened' errors
        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          function isHmrUrl(url) {
            var s = String(url || '');
            return (
              s.indexOf('vite-hmr') !== -1 ||
              s.indexOf('localhost') !== -1 ||
              s.indexOf(':3000') !== -1 ||
              s.indexOf('run.app') !== -1 ||
              s.indexOf('__vite') !== -1 ||
              s.indexOf('aistudio') !== -1
            );
          }

          function DummyHmrWebSocket(url) {
            var self = this;
            this.url = String(url || '');
            this.readyState = 1; // WebSocket.OPEN
            this.protocol = '';
            this.extensions = '';
            this.bufferedAmount = 0;
            this.binaryType = 'blob';

            var listeners = {};
            this.addEventListener = function (type, cb) {
              if (!listeners[type]) listeners[type] = [];
              listeners[type].push(cb);
            };
            this.removeEventListener = function (type, cb) {
              if (!listeners[type]) return;
              listeners[type] = listeners[type].filter(function (fn) { return fn !== cb; });
            };
            this.dispatchEvent = function (ev) {
              var cbs = listeners[ev && ev.type] || [];
              for (var i = 0; i < cbs.length; i++) {
                try { cbs[i].call(self, ev); } catch (e) {}
              }
              return true;
            };
            this.send = function () {};
            this.close = function () {
              self.readyState = 3;
            };

            setTimeout(function () {
              if (typeof self.onopen === 'function') {
                try { self.onopen({ type: 'open' }); } catch (e) {}
              }
              self.dispatchEvent({ type: 'open' });
            }, 10);
          }

          DummyHmrWebSocket.CONNECTING = 0;
          DummyHmrWebSocket.OPEN = 1;
          DummyHmrWebSocket.CLOSING = 2;
          DummyHmrWebSocket.CLOSED = 3;

          window.WebSocket = function (url, protocols) {
            if (isHmrUrl(url)) {
              return new DummyHmrWebSocket(url);
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 2. Global console and event suppressors for any residual HMR notices
        var isViteWsNoise = function (msg) {
          var s = String(msg || '');
          return (
            s.indexOf('WebSocket closed without opened') !== -1 ||
            s.indexOf('[vite] failed to connect to websocket') !== -1 ||
            s.indexOf('failed to connect to websocket') !== -1 ||
            s.indexOf('WebSocket connection to') !== -1
          );
        };

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var msg = (reason && (reason.message || reason.stack)) || reason || '';
            if (isViteWsNoise(msg)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        window.addEventListener(
          'error',
          function (event) {
            var msg = (event && (event.message || (event.error && event.error.message))) || '';
            if (isViteWsNoise(msg)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        var origConsoleError = console.error;
        console.error = function () {
          var firstArg = arguments.length > 0 ? arguments[0] : '';
          var combined = Array.prototype.map
            .call(arguments, function (a) {
              return a && a.message ? a.message : String(a);
            })
            .join(' ');
          if (isViteWsNoise(firstArg) || isViteWsNoise(combined)) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function () {
          var combined = Array.prototype.join.call(arguments, ' ');
          if (isViteWsNoise(combined)) {
            return;
          }
          return origConsoleWarn.apply(console, arguments);
        };
      })();
    </script>
