    <script>
      (function () {
        var isViteWsNoise = function (msg) {
          var s = String(msg || '');
          return (
            s.indexOf('WebSocket closed without opened') !== -1 ||
            s.indexOf('[vite] failed to connect to websocket') !== -1 ||
            s.indexOf('failed to connect to websocket') !== -1
          );
        };
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var msg = (reason && (reason.message || reason.stack)) || reason || '';
            if (isViteWsNoise(msg)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'error',
          function (event) {
            var msg = (event && (event.message || (event.error && event.error.message))) || '';
            if (isViteWsNoise(msg)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
        var origConsoleError = console.error;
        console.error = function () {
          var firstArg = arguments.length > 0 ? arguments[0] : '';
          var combined = Array.prototype.map
            .call(arguments, function (a) {
              return a && a.message ? a.message : String(a);
            })
            .join(' ');
          if (isViteWsNoise(firstArg) || isViteWsNoise(combined)) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
      })();
    </script>
